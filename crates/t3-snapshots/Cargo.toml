[package]
name = "t3-snapshots"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Renders app views headlessly to PNG (macOS Metal only) for visual review in CI."

[dependencies]
t3-app = { path = "../t3-app" }
t3-ui.workspace = true
t3-client.workspace = true
t3-protocol.workspace = true
t3-terminal.workspace = true
t3-diff = { workspace = true, features = ["gpui"] }
gpui-kit = { workspace = true, features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }
anyhow.workspace = true
serde_json.workspace = true
chrono.workspace = true

[lints]
workspace = true
