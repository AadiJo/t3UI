[package]
name = "t3-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
t3-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures.workspace = true
url.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
directories.workspace = true
parking_lot.workspace = true
base64.workspace = true
uuid.workspace = true
p256.workspace = true
sha2.workspace = true
rand_core.workspace = true

# TLS: macOS uses the system stack (Security.framework: Keychain trust, nothing to compile in C,
# so `script/check-macos.sh` works from Linux). Elsewhere rustls with aws-lc, which also gives
# tokio-tungstenite's rustls a crypto provider. Declared here rather than through the workspace
# entry because that one enables rustls unconditionally.
[target.'cfg(target_os = "macos")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "gzip", "native-tls"] }
tokio-tungstenite = { workspace = true, features = ["native-tls"] }
security-framework.workspace = true

[target.'cfg(not(target_os = "macos"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "gzip", "rustls"] }

[dev-dependencies]
tracing-subscriber.workspace = true

[lints]
workspace = true
