[package]
name = "t3-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "t3ui"
path = "src/main.rs"

[dependencies]
t3-protocol.workspace = true
t3-client.workspace = true
t3-ui.workspace = true
t3-logic.workspace = true
t3-diff = { workspace = true, features = ["gpui"] }
t3-markdown.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
# The viewer's IANA zone for usage windows (already in the tree through chrono).
iana-time-zone = "0.1"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
