[package]
name = "t3-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "t3ui"
path = "src/main.rs"

[dependencies]
t3-protocol.workspace = true
t3-client.workspace = true
t3-ui.workspace = true
t3-logic.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSArray", "NSError", "NSString", "NSURL"] }
objc2-app-kit = { workspace = true, features = ["NSApplication", "NSResponder", "NSWindow"] }
objc2-authentication-services.workspace = true
block2.workspace = true
dispatch2.workspace = true

[lints]
workspace = true
