[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/t3-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"
publish = false

[workspace.dependencies]
# Internal crates
t3-protocol = { path = "crates/t3-protocol" }
t3-client = { path = "crates/t3-client" }
t3-ui = { path = "crates/t3-ui" }
t3-terminal = { path = "crates/t3-terminal" }
t3-highlight = { path = "crates/t3-highlight" }
t3-logic = { path = "crates/t3-logic" }
t3-diff = { path = "crates/t3-diff", default-features = false }

# UI. gpui-kit re-exports GPUI (gpui-pre), gpui-base and gpui-component, pinned together.
gpui-kit = { version = "=0.7.0" }

# Wire + async
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
futures = "0.3"
url = { version = "2.5", features = ["serde"] }

# Utilities
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.26", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.23"
directories = "6"
parking_lot = "0.12"
security-framework = "3"
rust-embed = { version = "8.7", features = ["interpolate-folder-path"] }

# macOS native window glass (versions match what GPUI already links)
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
raw-window-handle = "0.6"

# Markdown + syntax highlighting. Pure-Rust regex (fancy) so macOS cross-checks need no C toolchain.
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy", "plist-load", "yaml-load"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"

[profile.dev]
# Dependencies are optimized so GPUI stays responsive in debug builds.
debug = "limited"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 16
debug = "line-tables-only"
