name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Every main commit gets a full run; only superseded PR pushes are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  linux:
    name: Linux check + tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GPUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang pkg-config libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  macos:
    name: macOS snapshots + smoke launch
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      # One debug build for both binaries. Features unify, so the app binary also carries
      # gpui's test-support; fine for a smoke launch, and it avoids compiling GPUI twice.
      # Release DMGs come from release.yml on demand.
      - name: Build
        run: cargo build -p t3-app -p t3-snapshots
      - name: Render headless scenes
        run: target/debug/t3-snapshots snapshots
      - name: Launch smoke test
        run: |
          # The app must start and keep running with a real window for a few seconds.
          target/debug/t3ui > smoke.log 2>&1 &
          PID=$!
          sleep 8
          if ! kill -0 "$PID"; then echo "app exited early"; cat smoke.log; exit 1; fi
          screencapture -x snapshots/smoke-launch.png || true
          kill "$PID" || true
          cat smoke.log
      - uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: snapshots/*.png
          if-no-files-found: error
