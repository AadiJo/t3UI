name: Markdown bench

# Streams a long message into t3-markdown and times each frame with block caching off and on.
# Run on demand: gh workflow run markdown-bench.yml -R AadiJo/t3UI --ref <branch>
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  bench:
    name: macOS markdown streaming bench
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
        with:
          key: markdown-bench
      - name: Bench
        run: cargo run --release -p t3-snapshots --bin markdown-bench | tee markdown-bench.txt
      - uses: actions/upload-artifact@v4
        with:
          name: markdown-bench
          path: markdown-bench.txt
